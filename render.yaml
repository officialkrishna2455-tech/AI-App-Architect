services:
  # ── Backend: FastAPI ──────────────────────────────────────────
  - type: web
    name: ai-app-architect-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/requirement_compiler.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: CORS_ORIGINS
        value: '["https://frontend-krishna2455.vercel.app","https://frontend-ioisx627h-krishna2455.vercel.app"]'
